<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRA CỨU NHÃN HIỆU - ĐẠI DIỆN CHỦ THỂ QUYỀN</title>
<style>
:root{--bg:#f2f5f5;--card:#fff;--ink:#12242b;--mute:#5b6e75;--line:#d9e2e4;--pri:#0b5563;--pri-ink:#fff;--mark:#ffd45c;--call:#0b7a4b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b1f;--card:#172629;--ink:#e6eff1;--mute:#93a8ae;--line:#2a3f44;--pri:#63b7c6;--pri-ink:#06242a;--mark:#7a5d00;--call:#4cc28a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0a3440 0%,#0b5563 100%);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;border-bottom:3px solid #f2c14e;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ttl{margin:0 0 8px;text-align:center;line-height:1.15}
.ttl .t1{display:block;font-size:clamp(1.3rem,6.4vw,1.8rem);font-weight:800;letter-spacing:.05em;color:#fff}
.ttl .t2{display:block;margin-top:5px;padding-top:6px;border-top:1px solid rgba(242,193,78,.55);font-size:clamp(.78rem,3.5vw,1rem);font-weight:700;letter-spacing:.14em;color:#f2c14e}
.mq{overflow:hidden;white-space:nowrap;margin:0 0 10px;font-size:.92rem;opacity:.95}
.mq span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.mq{white-space:normal}.mq span{padding-left:0;animation:none}}
.sb{position:relative}
.sb input{width:100%;font:inherit;padding:12px 58px 12px 14px;border:0;border-radius:10px;background:var(--card);color:var(--ink);outline:none}
.sb input:focus-visible{box-shadow:0 0 0 3px var(--mark)}
.clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:40px;padding:0 10px;border:0;background:none;color:var(--mute);font:inherit;font-size:.9rem;cursor:pointer;display:none}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sug button{display:block;width:100%;text-align:left;font:inherit;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;cursor:pointer}
.sug button:last-child{border-bottom:0}
main{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.hint{color:var(--mute);font-size:.92rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{font:inherit;font-size:.92rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.count{color:var(--mute);font-size:.92rem;margin:0 0 10px}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.rep h2{margin:0 0 2px;font-size:1.02rem;line-height:1.35}
.who{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.phones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.phones a{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--call);color:#fff;text-decoration:none;font-weight:600}
@media (prefers-color-scheme:dark){.phones a{color:#06241a}}
.phones button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);font:inherit;cursor:pointer}
.note{background:var(--mark);color:#3a2b00;padding:8px 10px;border-radius:8px;font-size:.92rem;margin:0 0 10px}
@media (prefers-color-scheme:dark){.note{color:#ffe9a8}}
.grp{padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
.grp b{display:block;font-weight:600;margin-bottom:2px}
.grp.hit{border-top-color:var(--pri)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
details summary{cursor:pointer;color:var(--pri);padding:6px 0;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.portals{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
.portals h3{margin:0 0 4px;font-size:1rem}
.portals p{margin:0 0 8px;color:var(--mute);font-size:.9rem}
.portals a{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--pri);text-decoration:none;font-weight:600}
.portals a small{display:block;color:var(--mute);font-weight:400;font-size:.86rem}

:root{--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--danger:#ff8a80}}
.tools{display:none;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tools button{flex:1;min-width:140px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--pri);font-weight:600;cursor:pointer}
.tools button.ok{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts button{font:inherit;font-size:.88rem;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--pri);cursor:pointer}
.acts button.del{color:var(--danger)}
.acts.top{margin:0 0 6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.md{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.md h3{margin:0 0 4px;font-size:1.05rem}
.md label{display:block;margin:12px 0 4px;font-weight:600;font-size:.92rem}
.md input,.md textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.md textarea{min-height:90px;resize:vertical}
.md .hint2{color:var(--mute);font-size:.84rem;margin-top:3px}
.md .err{color:var(--danger);font-size:.9rem;min-height:1.2em;margin-top:8px}
.md .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.md .row button{flex:1;min-width:120px;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.md .row button.ok{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.md .row button.del{color:var(--danger)}
.toast{z-index:30}
.portals .pl{border-top:1px solid var(--line);padding:8px 0}
.portals .pl a{border-top:0;padding:2px 0}
.portals .pl .acts{margin-top:4px}
footer{color:var(--mute);font-size:.82rem;text-align:center;padding:4px 12px 20px}
.fbtn{display:block;text-align:center;padding:11px;border-radius:10px;background:var(--pri);color:var(--pri-ink);font-weight:600;cursor:pointer;margin-top:6px}
.util p{margin:6px 0}
#login{display:none;position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(180deg,#0a3440 0%,#0b5563 60%,#0f1b1f 100%);color:#fff}
.lgw{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 28px}
.lgt{margin:12px 0 22px}
.lgt .t1{font-size:clamp(1.5rem,7.4vw,2rem)}
.lgc{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;border-top:4px solid #f2c14e}
.lgc h2{margin:0 0 6px;font-size:1.2rem}
.lgc label{display:block;margin:12px 0 4px;font-weight:600;font-size:.92rem}
.lgc input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lgc .err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin-top:8px}
.lgc .hint2{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.lgb{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--pri);color:var(--pri-ink);font:inherit;font-weight:700;cursor:pointer}
.lgl{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:var(--pri);font:inherit;cursor:pointer}
.lgf{text-align:center;color:#cfe3e7;font-size:.88rem;margin:18px 0 0}
.util p a{display:inline;border:0;padding:0;font-weight:600}
.fb2{background:var(--card);color:var(--pri);border:1px solid var(--pri);width:100%;font:inherit;font-weight:600}
.chips button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.phones a.zl{background:var(--pri);color:var(--pri-ink)}
.ug{margin:0 0 10px}
.ug>summary{font-weight:700;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--pri);cursor:pointer}
.ug[open]>summary{border-radius:10px 10px 0 0}
.undo{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:31;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:.9rem;display:none;align-items:center;gap:10px;max-width:92%}
.undo.on{display:flex}
.undo button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:var(--pri);color:var(--pri-ink);cursor:pointer}

/* ===== Trang đăng nhập: bố cục gọn, có viền, không tràn ===== */
#login{--card:#fff;--ink:#12242b;--mute:#5b6e75;--line:#b9c8cc;--bg:#f4f7f8;--pri:#0b5563;--pri-ink:#fff;--danger:#b3261e;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#login *{box-sizing:border-box;max-width:100%}
.lgw{width:100%;max-width:420px;min-height:100%;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.lgt{margin:0 0 18px}
.lgt .t1{font-size:clamp(1.15rem,6vw,1.65rem);letter-spacing:.03em;white-space:normal;overflow-wrap:anywhere}
.lgt .t2{font-size:clamp(.7rem,3.1vw,.92rem);letter-spacing:.08em;white-space:normal;overflow-wrap:anywhere}
.lgc{width:100%;padding:20px 18px 18px;background:#fff;color:#12242b;border:1px solid #cfdadd;border-top:5px solid #f2c14e;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);overflow-wrap:anywhere}
.lgc h2{margin:0;font-size:1.25rem;color:#0b5563;text-align:center}
.lgc .sub{margin:4px 0 6px;text-align:center;color:#5b6e75;font-size:.9rem}
.lgc p{overflow-wrap:anywhere}
.lgc label{display:block;margin:14px 0 6px;font-size:.9rem;font-weight:600;color:#12242b}
.lgc input,.lgc textarea{display:block;width:100%;min-width:0;font:inherit;font-size:1rem;color:#12242b;background:#fff;border:1.5px solid #b9c8cc;border-radius:10px}
.lgc input{height:48px;padding:0 12px}
.lgc textarea{padding:10px;resize:vertical}
.lgc input:focus,.lgc textarea:focus{outline:none;border-color:#0b5563;box-shadow:0 0 0 3px rgba(11,85,99,.22)}
.lgc .err{min-height:1.3em;margin-top:8px;font-size:.9rem;color:#b3261e;text-align:center}
.lgc .hint2{color:#5b6e75;font-size:.88rem}
.lgb{display:block;width:100%;height:48px;margin-top:14px;padding:0 12px;border:0;border-radius:10px;background:linear-gradient(180deg,#0f6b7c,#0b5563);color:#fff;font:inherit;font-size:1rem;font-weight:700;letter-spacing:.02em;box-shadow:0 2px 6px rgba(11,85,99,.4);cursor:pointer}
.lgl{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:#0b5563;font:inherit;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lgf{margin:16px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);color:#d6e6ea;font-size:.85rem;line-height:1.6;text-align:center}

/* ===== Giao diện chính: viền rõ, gọn, không tràn ===== */
:root{--line:#b4c3c8}
@media (prefers-color-scheme:dark){:root{--line:#3f565c}}
main{overflow-wrap:anywhere}
header{padding:max(8px,env(safe-area-inset-top)) 12px 10px}
.ttl{margin:0 0 6px}
.ttl .t1{font-size:clamp(1.05rem,5.2vw,1.4rem)}
.ttl .t2{margin-top:3px;padding-top:4px;font-size:clamp(.66rem,3vw,.82rem);letter-spacing:.12em}
.mq{margin:0 0 8px;font-size:.82rem}
.sb input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sb input{border:1.5px solid rgba(255,255,255,.6)}
.tabs{gap:6px}
.tabs button{padding:10px 4px;font-size:.92rem;white-space:nowrap;border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tools button{min-width:0;font-size:.9rem;white-space:nowrap;border:1.5px solid var(--line)}
#home{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 12px 4px;margin:0 0 12px}
#home .hint{margin-top:0}
#cats{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:8px 10px;margin:0 0 12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#cats::before{content:"Ngành hàng";flex:0 0 auto;align-self:center;font-size:.85rem;font-weight:700;color:var(--pri);padding-right:4px}
#cats button{flex:0 0 auto;white-space:nowrap}
.chips button{border:1.5px solid var(--line)}
.rep{border:1.5px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.portals{border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.acts button,.phones button{border-width:1.5px}
.count{font-weight:600;color:var(--ink)}
.hint2{color:var(--mute);font-size:.86rem;margin:6px 0}
.phones{flex-direction:column;align-items:stretch;gap:8px}
.pr{display:flex;gap:8px;align-items:stretch}
.pr a:first-child{flex:1;justify-content:center;text-align:center}

/* ===== Co giãn theo mọi cỡ màn hình ===== */
html{font-size:calc(var(--fs,1) * clamp(15px, 14px + .4vw, 18px));-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
header{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
header>*{max-width:920px;margin-left:auto;margin-right:auto}
main{width:100%;max-width:960px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.tabs button,.acts button,.phones a,.phones button,.chips button,.tools button{min-height:42px}
.acts button{display:inline-flex;align-items:center;justify-content:center}
#list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
#list>.rep,#list>.empty{margin:0}
#list>.empty{grid-column:1/-1}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
@media (hover:hover){button:hover,.fbtn:hover{filter:brightness(.96)}.chips button:hover,.tabs button:hover{border-color:var(--pri)}}
@media (max-width:340px){.tabs button{font-size:.82rem;padding:8px 2px}.chips button{font-size:.84rem;padding:6px 10px}.rep{padding:12px}.phones a{padding:9px 10px}}
@media (min-width:600px){.ov{align-items:center}.md{border-radius:16px;max-height:88vh;border:1.5px solid var(--line)}.undo{bottom:32px}}
@media (min-width:720px){.rep{padding:16px}}
@media (min-width:900px){
  #list{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{max-width:1080px;padding-top:16px;padding-bottom:32px}
  header>*{max-width:1040px}
  .ttl .t1{font-size:1.9rem}.ttl .t2{font-size:.95rem}.mq{font-size:.95rem}
  .sb input{padding-top:14px;padding-bottom:14px}
  .tabs{max-width:560px}
  #cats{flex-wrap:wrap;overflow:visible}
  .util{display:block}
}
@media (min-width:1280px){html{font-size:calc(var(--fs,1) * 18px)}main{max-width:1180px}header>*{max-width:1140px}}
@media (max-height:500px) and (orientation:landscape){header{position:static}.ttl .t2{display:none}.lgw{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
#login .lgw{max-width:420px}
@media (min-width:900px){#login .lgw{max-width:460px}#login .lgt .t1{font-size:1.9rem}#login .lgt .t2{font-size:.95rem}}
header>.ttl,header>.mq,header>.sb{margin-left:auto;margin-right:auto}
.pr a:first-child{white-space:nowrap}
.lgs{display:block;width:100%;height:48px;margin-top:10px;border:1.5px solid #0b5563;border-radius:10px;background:#fff;color:#0b5563;font:inherit;font-weight:700;cursor:pointer}
</style>

<body>
<div id="login"></div>
<header>
  <h1 class="ttl"><span class="t1">TRA CỨU NHÃN HIỆU</span><span class="t2">ĐẠI DIỆN CHỦ THỂ QUYỀN</span></h1>
  <div class="mq" aria-label="Tác giả Nguyễn Văn Hảo, số điện thoại 0913294532"><span>Tác giả Nguyễn Văn Hảo - SĐT 0913294532</span></div>
  <div class="sb">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Nhãn hiệu, công ty, số điện thoại…" aria-label="Tìm kiếm">
    <button class="clr" id="clr" aria-label="Xóa">Xóa</button>
    <div class="sug" id="sug"></div>
  </div>
</header>
<main>
  <div class="tabs">
    <button id="t1" aria-pressed="true">Tra cứu</button>
    <button id="t2" aria-pressed="false">Đại diện</button>
    <button id="t3" aria-pressed="false">Tiện ích</button>
  </div>
  <div class="tools" id="tools"><button type="button" class="ok" data-act="ar">Thêm đại diện</button><button type="button" data-act="bk">Sao lưu / Khôi phục</button></div>
  <div class="chips" id="cats"></div>
  <div id="home">
    <p class="hint">Gõ tên nhãn hiệu để biết đơn vị đại diện và số điện thoại cần liên hệ. Có thể gõ không dấu.</p>
    <div class="chips" id="chips"></div>
    <div id="homeX"></div>
  </div>
  <div id="util" style="display:none"></div>
  <div id="portalsHome"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <p class="hint2" id="disc" style="display:none">Thông tin chỉ mang tính tham khảo, cần xác minh trước khi sử dụng chính thức.</p>
  <div id="portalsRes"></div>
</main>
<div class="ov" id="ov"></div>
<div class="toast" id="toast"></div>

const sq = s => norm(s).replace(/[^a-z0-9]+/g,'');

function hl(text,q){
  const k=q?sq(q):''; if(!k) return esc(text);
  const ch=[...text]; let flat='',idx=[];
  ch.forEach((c,i)=>{for(const x of norm(c)){if(/[a-z0-9]/.test(x)){flat+=x;idx.push(i)}}});
  let out='',pos=0,s=0,i;
  while((i=flat.indexOf(k,s))>-1){const a=idx[i],b=idx[i+k.length-1]+1;if(a<pos){s=i+1;continue}
    out+=esc(ch.slice(pos,a).join(''))+'<mark>'+esc(ch.slice(a,b).join(''))+'</mark>';pos=b;s=i+k.length}
  return out+esc(ch.slice(pos).join(''));
}

function rowsToReps(rows){

    if(!r.length||isH(r))continue;
    let c;if(hm)c=(hm.ph<0&&hm.con>=0&&r.length>hlen)?{...hm,ph:hm.con+1,br:r.length-1}:hm;

async function readFile(file){

  const z=await unzip(buf);
  if(nm.endsWith('.docx'))return rowsToReps(docxRows(await inflate(z['word/document.xml'])));
  if(nm.endsWith('.xlsx')){const k=Object.keys(z).filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]))[0];
    return rowsToReps(xlsxRows(await inflate(z['xl/sharedStrings.xml']),await inflate(z[k])))}
  throw new Error('Chỉ hỗ trợ file .docx và .xlsx.');
}

const TJS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
function loadTess(){return window.Tesseract?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=TJS;s.onload=ok;s.onerror=()=>no(new Error('Không tải được bộ đọc chữ. Lần dùng đầu tiên cần có mạng.'));document.head.appendChild(s)})}
async function ocrText(b64){
  await loadTess();
  if(!window.Tesseract)throw new Error('Bộ đọc chữ đã tải nhưng không khởi động được trên máy này.');
  const det=e=>e&&e.message?e.message:(typeof e==='string'?e:(()=>{try{return JSON.stringify(e)}catch(x){return 'không rõ'}})());
  let to;const lim=new Promise((_,no)=>{to=setTimeout(()=>no(new Error('Quá thời gian (90 giây). Bộ đọc chữ không chạy được trên máy hoặc app này, hoặc tải dữ liệu ngôn ngữ bị chặn.')),90000)});
  try{const r=await Promise.race([window.Tesseract.recognize('data:image/jpeg;base64,'+b64,'eng'),lim]);return (r&&r.data&&r.data.text)||''}
  catch(e){throw new Error(e&&e.message&&e.message.indexOf('Quá thời gian')===0?e.message:'Bộ đọc chữ gặp lỗi: '+det(e))}
  finally{clearTimeout(to)}
}
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function ocrCandidates(text){
  const toks=(text.match(/[A-Za-z0-9&'\-]{2,}/g)||[]).map(sq).filter(Boolean);
  const B=new Map();DATA.forEach(r=>r.groups.forEach(g=>g[1].split(/[;,()]+/).forEach(x=>{x=x.trim().replace(PRE,'');const k=sq(x);if(k.length>=3&&k.length<=24&&!B.has(k))B.set(k,x)})));
  const f=new Map();
  for(let i=0;i<toks.length;i++){let acc='';for(let n=0;n<3&&i+n<toks.length;n++){acc+=toks[i+n];if(B.has(acc)&&!f.has(acc))f.set(acc,{name:B.get(acc),confidence:'trung bình'})}}
  if(!f.size)for(const w of new Set(toks)){if(w.length<5||/^\d+$/.test(w))continue;for(const [k,v] of B){if(Math.abs(k.length-w.length)<=1&&lev(k,w)<=1&&!f.has(k))f.set(k,{name:v,confidence:'thấp'})}}
  return [...f.values()].slice(0,5);
}
function chipsFor(text){

}
